" cy="64" r="8" fill="none" stroke="#fff" stroke-width="4"/><circle cx="134" cy="52" r="3" fill="#fff"/><text x="122" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#26233c">2. Profile visit</text><text x="122" y="169" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#68647a">Clear bio, location</text><text x="122" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#68647a">and next step</text></g><path d="M635 345 h38 l-12 -12 m12 12 l-12 12" fill="none" stroke="#b46de2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(685 220)"><rect width="245" height="250" rx="22" fill="#fff" stroke="#ead9e8" stroke-width="2"/><circle cx="122" cy="64" r="37" fill="url(#accent)"/><path d="M102 48 h40 v28 h-23 l-12 9 v-9 h-5z" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><text x="122" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#26233c">3. WhatsApp</text><text x="122" y="169" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#68647a">A real question, quote</text><text x="122" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#68647a">or booking enquiry</text></g><path d="M945 345 h38 l-12 -12 m12 12 l-12 12" fill="none" stroke="#b46de2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(995 220)"><rect width="145" height="250" rx="22" fill="#29243f"/><circle cx="72" cy="64" r="37" fill="url(#accent)"/><path d="M55 66 l12 12 24 -27" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">4. Outcome</text><text x="72" y="169" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#e7dff0">Booking</text><t