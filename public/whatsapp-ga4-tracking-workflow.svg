<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">WhatsApp click tracking workflow in GA4</title><desc id="desc">Three steps: a visitor clicks the website WhatsApp link, GA4 records a whatsapp_click key event, and the marketer compares pages and traffic sources. Real conversations must be counted in WhatsApp.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5faf7"/><stop offset="1" stop-color="#edf3fb"/></linearGradient></defs><rect width="1200" height="675" rx="26" fill="url(#bg)"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="65" y="70" font-size="18" font-weight="700" letter-spacing="3" fill="#17854d">THE TRACKING FLOW</text><text x="65" y="119" font-size="36" font-weight="700" fill="#172f42">From WhatsApp click to useful campaign data</text>
<rect x="65" y="170" width="300" height="220" rx="22" fill="#fff" stroke="#d7e5df" stroke-width="2"/><circle cx="215" cy="230" r="36" fill="#dcf8e8"/><path d="M197 215 Q190 227 204 240 Q219 253 233 237 L223 227 L215 233 Q205 228 205 220 L210 216 Z" fill="#13a45b"/><text x="215" y="294" font-size="23" text-anchor="middle" font-weight="700" fill="#19364a">1. Website click</text><text x="215" y="326" font-size="17" text-anchor="middle" fill="#526b7a">Visitor taps a WhatsApp</text><text x="215" y="350" font-size="17" text-anchor="middle" fill="#526b7a">link or button</text>
<path d="M380 280 H425" stroke="#91a8b7" stroke-width="4" stroke-linecap="round"/><path d="M415 269 L427 280 L415 291" fill="none" stroke="#91a8b7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="450" y="170" width="300" height="220" rx="22" fill="#fff" stroke="#d9dff6" stroke-width="2"/><circle cx="600" cy="230" r="36" fill="#e9edff"/><path d="M583 230 L595 242 L618 216" fill="none" stroke="#5c70d4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="294" font-size="23" text-anchor="middle" font-weight="700" fill="#19364a">2. GA4 event</text><text x="600" y="326" font-size="17" text-anchor="middle" fill="#526b7a">Create and mark</text><text x="600" y="350" font-size="17" text-anchor="middle" fill="#526b7a">whatsapp_click as key event</text>
<path d="M765 280 H810" stroke="#91a8b7" stroke-width="4" stroke-linecap="round"/><path d="M800 269 L812 280 L800 291" fill="none" stroke="#91a8b7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="835" y="170" width="300" height="220" rx="22" fill="#fff" stroke="#f0dfc5" stroke-width="2"/><circle cx="985" cy="230" r="36" fill="#fff0d9"/><path d="M968 241 V223 M985 241 V212 M1002 241 V227" stroke="#d58c26" stroke-width="6" stroke-linecap="round"/><text x="985" y="294" font-size="23" text-anchor="middle" font-weight="700" fill="#19364a">3. Analyse</text><text x="985" y="326" font-size="17" text-anchor="middle" fill="#526b7a">Compare pages, channels</text><text x="985" y="350" font-size="17" text-anchor="middle" fill="#526b7a">and campaign performance</text>
<rect x="65" y="430" width="1070" height="170" rx="22" fill="#16354a"/><circle cx="115" cy="480" r="19" fill="#ffd36b"/><text x="115" y="487" font-size="24" text-anchor="middle" font-weight="700" fill="#16354a">!</text><text x="155" y="486" font-size="23" font-weight="700" fill="#fff">Important: a click is not a confirmed conversation</text><text x="100" y="530" font-size="18" fill="#dbe7ed">GA4 can measure the intent to message, but it cannot confirm that a message was sent</text><text x="100" y="558" font-size="18" fill="#dbe7ed">or that a lead became a customer. Count actual chats in WhatsApp or your CRM.</text>
<text x="65" y="642" font-size="15" fill="#526b7a">Illustration: GA4 website click tracking • Hitesh Jaganiya</text></g></svg>