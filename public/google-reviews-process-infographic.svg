<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">A simple process for earning more genuine Google reviews</title><desc id="desc">Three steps: create your Google review link, ask every customer at a natural moment, and respond to feedback. Do not offer incentives or filter who can leave a review.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4faf6"/><stop offset="1" stop-color="#eef3f8"/></linearGradient></defs><rect width="1200" height="675" rx="26" fill="url(#bg)"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="65" y="70" font-size="18" font-weight="700" letter-spacing="3" fill="#168451">THE REVIEW ROUTINE</text><text x="65" y="119" font-size="36" font-weight="700" fill="#17343f">Make it easy. Ask consistently. Stay genuine.</text>
<rect x="65" y="165" width="330" height="260" rx="22" fill="#fff" stroke="#d8e7df" stroke-width="2"/><circle cx="230" cy="230" r="38" fill="#e3f6eb"/><path d="M214 214h27a8 8 0 0 1 8 8v20h-25l-10 8v-28a8 8 0 0 1 8-8z" fill="none" stroke="#188752" stroke-width="4" stroke-linejoin="round"/><text x="230" y="300" font-size="24" text-anchor="middle" font-weight="700" fill="#193943">1. Prepare</text><text x="230" y="334" font-size="18" text-anchor="middle" fill="#536c75">Create your direct Google</text><text x="230" y="360" font-size="18" text-anchor="middle" fill="#536c75">review link and QR code</text><text x="230" y="390" font-size="15" text-anchor="middle" fill="#168451">Remove friction</text>
<path d="M410 295 H445" stroke="#90a8b4" stroke-width="4" stroke-linecap="round"/><path d="M435 284 L447 295 L435 306" fill="none" stroke="#90a8b4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="460" y="165" width="330" height="260" rx="22" fill="#fff" stroke="#d9e0f4" stroke-width="2"/><circle cx="625" cy="230" r="38" fill="#e9edff"/><path d="M607 230 Q600 221 610 214 Q620 208 628 219 L637 211 Q648 220 640 231 Q628 247 607 230z" fill="#5d70cf"/><text x="625" y="300" font-size="24" text-anchor="middle" font-weight="700" fill="#193943">2. Ask everyone</text><text x="625" y="334" font-size="18" text-anchor="middle" fill="#536c75">Use WhatsApp, the counter</text><text x="625" y="360" font-size="18" text-anchor="middle" fill="#536c75">or the natural handover</text><text x="625" y="390" font-size="15" text-anchor="middle" fill="#5d70cf">Same request for all</text>
<path d="M805 295 H840" stroke="#90a8b4" stroke-width="4" stroke-linecap="round"/><path d="M830 284 L842 295 L830 306" fill="none" stroke="#90a8b4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="855" y="165" width="280" height="260" rx="22" fill="#fff" stroke="#f0dfc5" stroke-width="2"/><circle cx="995" cy="230" r="38" fill="#fff0d9"/><path d="M978 232 L990 244 L1013 219" fill="none" stroke="#cf841f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="995" y="300" font-size="24" text-anchor="middle" font-weight="700" fill="#193943">3. Respond</text><text x="995" y="334" font-size="18" text-anchor="middle" fill="#536c75">Thank reviewers and</text><text x="995" y="360" font-size="18" text-anchor="middle" fill="#536c75">handle concerns calmly</text><text x="995" y="390" font-size="15" text-anchor="middle" fill="#cf841f">Build trust over time</text>
<rect x="65" y="462" width="1070" height="135" rx="22" fill="#173844"/><circle cx="112" cy="510" r="20" fill="#ffcb70"/><text x="112" y="517" font-size="24" font-weight="700" text-anchor="middle" fill="#173844">!</text><text x="151" y="516" font-size="23" font-weight="700" fill="#fff">Keep every review request policy-safe</text><text x="100" y="552" font-size="18" fill="#d9e6e8">No discounts, cashback, gifts, purchased reviews or asking only happy customers.</text><text x="65" y="642" font-size="15" fill="#536c75">Illustration: a consistent process for genuine customer reviews • Hitesh Jaganiya</text></g></svg>