<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2f8fc"/><stop offset="1" stop-color="#ecf8f3"/></linearGradient><linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6edcc8"/><stop offset="1" stop-color="#7aaff2"/></linearGradient></defs><rect width="1200" height="675" rx="28" fill="url(#bg)"/><text x="60" y="64" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#157d78">CLINIC GOOGLE ADS FRAMEWORK</text><text x="60" y="116" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#182b3c">Five checks before you launch</text><text x="60" y="151" font-family="Arial,sans-serif" font-size="19" fill="#5e7180">Build around policy, patient trust and accurate measurement.</text><g transform="translate(60 202)"><rect width="200" height="235" rx="22" fill="#fff" stroke="#d7e6ee" stroke-width="2"/><circle cx="100" cy="52" r="29" fill="url(#acc)"/><path d="M86 52 l10 10 19 -22" fill="none" stroke="#153e4a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="107" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#182b3c">1. Check rules</text><text x="100" y="143" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#5e7180">Medical council</text><text x="100" y="166" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#5e7180">and Google policy</text><rect x="225" width="200" height="235" rx="22" fill="#fff" stroke="#d7e6ee" stroke-width="2"/><circle cx="325" cy="52" r="29" fill="url(#acc)"/><circle cx="319" cy="47" r="10" fill="none" stroke="#153e4a" stroke-width="4"/><path d="M327 55 l12 12" stroke="#153e4a" stroke-width="4" stroke-linecap="round"/><text x="325" y="107" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#182b3c">2. Match intent</text><text x="325" y="143" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#5e7180">Specialty plus</text><text x="325" y="166" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#5e7180">service area</text><rect x="450" width="200" height="235" rx="22" fill="#fff" stroke="#d7e6ee" stroke-width="2"/><circle cx="550" cy="52" r="29" fill="url(#acc)"/><path d="M535 37 h30 v30 h-30z M541 45 h18 M541 52 h18 M541 59 h12" fill="none" stroke="#153e4a" stroke-width="3" stroke-linejoin="round"/><text x="550" y="107" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#182b3c">3. Page for trust</text><text x="550" y="143" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#5e7180">Clear credentials,</text><text x="550" y="166" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#5e7180">location and hours</text><rect x="675" width="200" height="235" rx="22" fill="#fff" stroke="#d7e6ee" stroke-width="2"/><circle cx="775" cy="52" r="29" fill="url(#acc)"/><path d="M759 51 h32 M775 35 v32 M763 39 l24 24 M787 39 l-24 24" fill="none" stroke="#153e4a" stroke-width="3" stroke-linecap="round"/><text x="775" y="107" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#182b3c">4. Protect data</text><text x="775" y="143" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#5e7180">No patient-identifying</text><text x="775" y="166" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#5e7180">data in analytics</text><rect x="900" width="200" height="235" rx="22" fill="#fff" stroke="#d7e6ee" stroke-width="2"/><circle cx="1000" cy="52" r="29" fill="url(#acc)"/><path d="M984 63 v-15 M1000 63 v-28 M1016 63 v-21" stroke="#153e4a" stroke-width="5" stroke-linecap="round"/><text x="1000" y="107" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#182b3c">5. Measure</text><text x="1000" y="143" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#5e7180">Calls, messages</text><text x="1000" y="166" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#5e7180">and appointments</text></g><rect x="60" y="482" width="1080" height="92" rx="20" fill="#17374a"/><text x="90" y="519" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#86e2d3">REMEMBER</text><text x="90" y="550" font-family="Arial,sans-serif" font-size="21" fill="#fff">An ad approved by Google is not automatically cleared under medical advertising rules.</text><text x="60" y="621" font-family="Arial,sans-serif" font-size="15" fill="#637887">Guidance only. Verify current policy and regulatory requirements before launching.</text></svg>