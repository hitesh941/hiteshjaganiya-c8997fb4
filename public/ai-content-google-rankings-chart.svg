  <line x1="110" y1="95" x2="110" y2="760" stroke="#64736d" stroke-width="2"/>
  <g stroke="#d7dedb" stroke-width="2">
    <line x1="110" y1="625" x2="1530" y2="625"/><line x1="110" y1="490" x2="1530" y2="490"/><line x1="110" y1="355" x2="1530" y2="355"/><line x1="110" y1="220" x2="1530" y2="220"/>
  </g>
