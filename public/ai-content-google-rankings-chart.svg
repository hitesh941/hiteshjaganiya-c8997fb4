  <title id="title">Share of AI-Generated Content in Google's Top 20 Results</title>
  <desc id="desc">Illustrative summary of reported figures: February 2019 2.27 percent, December 2023 8.48 percent, March 2024 7.43 percent, July 2025 19.56 percent, September 2025 17.31 percent.</desc>
