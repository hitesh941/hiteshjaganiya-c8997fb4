<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Google Ads high CPC diagnosis checklist</title>
<desc id="desc">A visual checklist of eight areas to investigate when Google Ads cost per click is high.</desc>
<rect width="1200" height="675" rx="24" fill="#f7faf8"/>
<text x="60" y="70" fill="#18372f" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">High CPC? Check these 8 areas first.</text>
<text x="60" y="105" fill="#5d716a" font-family="Arial, Helvetica, sans-serif" font-size="20">Work from account signals to search intent, landing pages and conversion data.</text>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="60" y="145" width="500" height="96" rx="18" fill="#fff" stroke="#dce8e2"/><circle cx="98" cy="193" r="23" fill="#2aa96b"/><text x="98" y="201" text-anchor="middle" fill="#fff" font-size="15" font-weight="800">01</text><text x="135" y="184" fill="#18372f" font-size="19" font-weight="800">Quality Score signals</text><text x="135" y="212" fill="#64766f" font-size="14">Expected CTR • Ad relevance • Landing page</text><rect x="610" y="145" width="500" height="96" rx="18" fill="#fff" stroke="#dce8e2"/><circle cx="648" cy="193" r="23" fill="#2aa96b"/><text x="648" y="201" text-anchor="middle" fill="#fff" font-size="15" font-weight="800">02</text><text x="685" y="184" fill="#18372f" font-size="19" font-weight="800">Ad group structure</text><text x="685" y="212" fill="#64766f" font-size="14">Tight keyword themes and relevant ads</text><rect x="60" y="265" width="500" height="96" rx="18" fill="#fff" stroke="#dce8e2"/><circle cx="98" cy="313" r="23" fill="#2aa96b"/><text x="98" y="321" text-anchor="middle" fill="#fff" font-size="15" font-weight="800">03</text><text x="135" y="304" fill="#18372f" font-size="19" font-weight="800">Auction competition</text><text x="135" y="332" fill="#64766f" font-size="14">Auction Insights and changing competitors</text><rect x="610" y="265" width="500" height="96" rx="18" fill="#fff" stroke="#dce8e2"/><circle cx="648" cy="313" r="23" fill="#2aa96b"/><text x="648" y="321" text-anchor="middle" fill="#fff" font-size="15" font-weight="800">04</text><text x="685" y="304" fill="#18372f" font-size="19" font-weight="800">Match types</text><text x="685" y="332" fill="#64766f" font-size="14">Search terms and negative keywords</text><rect x="60" y="385" width="500" height="96" rx="18" fill="#fff" stroke="#dce8e2"/><circle cx="98" cy="433" r="23" fill="#2aa96b"/><text x="98" y="441" text-anchor="middle" fill="#fff" font-size="15" font-weight="800">05</text><text x="135" y="424" fill="#18372f" font-size="19" font-weight="800">Landing page</text><text x="135" y="452" fill="#64766f" font-size="14">Message match, relevance and mobile UX</text><rect x="610" y="385" width="500" height="96" rx="18" fill="#fff" stroke="#dce8e2"/><circle cx="648" cy="433" r="23" fill="#2aa96b"/><text x="648" y="441" text-anchor="middle" fill="#fff" font-size="15" font-weight="800">06</text><text x="685" y="424" fill="#18372f" font-size="19" font-weight="800">Competitor terms</text><text x="685" y="452" fill="#64766f" font-size="14">Check whether brand bidding converts</text><rect x="60" y="505" width="500" height="96" rx="18" fill="#fff" stroke="#dce8e2"/><circle cx="98" cy="553" r="23" fill="#2aa96b"/><text x="98" y="561" text-anchor="middle" fill="#fff" font-size="15" font-weight="800">07</text><text x="135" y="544" fill="#18372f" font-size="19" font-weight="800">Bid strategy</text><text x="135" y="572" fill="#64766f" font-size="14">Make sure bidding matches the real goal</text><rect x="610" y="505" width="500" height="96" rx="18" fill="#fff" stroke="#dce8e2"/><circle cx="648" cy="553" r="23" fill="#2aa96b"/><text x="648" y="561" text-anchor="middle" fill="#fff" font-size="15" font-weight="800">08</text><text x="685" y="544" fill="#18372f" font-size="19" font-weight="800">Conversion tracking</text><text x="685" y="572" fill="#64766f" font-size="14">Give Google reliable data to optimize</text>
</g>
<rect x="60" y="620" width="1080" height="2" fill="#dce8e2"/>
<text x="60" y="652" fill="#5d716a" font-family="Arial, Helvetica, sans-serif" font-size="15">The goal is not the cheapest click. It is the right click at a sustainable acquisition cost.</text>
</svg>