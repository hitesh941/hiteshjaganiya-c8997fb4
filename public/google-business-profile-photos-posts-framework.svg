<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" rx="28" fill="#f4f8f7"/><text x="70" y="75" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing="3" fill="#0f766e">A PRACTICAL LOCAL SEO PRIORITY ORDER</text><text x="70" y="125" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" fill="#123b43">Fundamentals first. Help customers next.</text><g font-family="Arial,Helvetica,sans-serif"><rect x="70" y="180" width="500" height="185" rx="22" fill="#d9eeea" stroke="#a9d5cf" stroke-width="2"/><circle cx="115" cy="230" r="23" fill="#0f766e"/><path d="M104 230l8 8 15-17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="155" y="238" font-size="25" font-weight="700" fill="#123b43">Prioritise first</text><text x="105" y="290" font-size="20" fill="#24545a">• Correct primary category</text><text x="105" y="322" font-size="20" fill="#24545a">• Complete, accurate details</text><text x="105" y="354" font-size="20" fill="#24545a">• Genuine reviews and relevant links</text><rect x="630" y="180" width="500" height="185" rx="22" fill="#fff" stroke="#d2e1df" stroke-width="2"/><circle cx="675" cy="230" r="23" fill="#0f766e"/><path d="M664 230l8 8 15-17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="715" y="238" font-size="25" font-weight="700" fill="#123b43">Help customers decide</text><text x="665" y="290" font-size="20" fill="#24545a">• Clear, genuine business photos</text><text x="665" y="322" font-size="20" fill="#24545a">• Entrance, space, products and team</text><text x="665" y="354" font-size="20" fill="#24545a">• Timely, useful profile posts</text><path d="M320 390v35h560v-35" fill="none" stroke="#8fbab5" stroke-width="4" stroke-linecap="round"/><rect x="250" y="435" width="700" height="115" rx="22" fill="#123b43"/><text x="600" y="478" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">Don't treat photos or posts as a ranking guarantee</text><text x="600" y="516" text-anchor="middle" font-size="21" fill="#c8f7ed">Make the profile accurate, useful and trustworthy.</text><text x="70" y="620" font-size="17" fill="#567477">Based on Google's local-ranking guidance and the limited test described in this article.</text></g></svg>