<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f8fc"/><stop offset="1" stop-color="#edf8f5"/></linearGradient><linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#65d9c7"/><stop offset="1" stop-color="#6baef5"/></linearGradient></defs><rect width="1200" height="675" rx="28" fill="url(#bg)"/><text x="64" y="66" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#167c78">HOW AI SEARCH DISCOVERS INFORMATION</text><text x="64" y="120" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#182b3c">Two paths, different timelines</text><rect x="65" y="178" width="510" height="310" rx="24" fill="#fff" stroke="#d7e5ef" stroke-width="2"/><rect x="625" y="178" width="510" height="310" rx="24" fill="#fff" stroke="#cce8e2" stroke-width="2"/><circle cx="320" cy="246" r="38" fill="url(#teal)"/><path d="M300 246 h40 M320 226 v40 M306 232 l28 28 M334 232 l-28 28" stroke="#163d4a" stroke-width="4" stroke-linecap="round"/><text x="320" y="316" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#182b3c">Training data</text><text x="320" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#5e7180">Model knowledge learned earlier</text><rect x="190" y="390" width="260" height="46" rx="23" fill="#edf1f7"/><text x="320" y="419" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#4a5b6b">Slow • indirect influence</text><circle cx="880" cy="246" r="38" fill="url(#teal)"/><circle cx="872" cy="238" r="15" fill="none" stroke="#163d4a" stroke-width="4"/><path d="M883 249 l15 15 M854 266 h52" fill="none" stroke="#163d4a" stroke-width="4" stroke-linecap="round"/><text x="880" y="316" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#182b3c">Live retrieval</text><text x="880" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#5e7180">Search, fetch, summarise and cite</text><rect x="750" y="390" width="260" height="46" rx="23" fill="#e4f7f2"/><text x="880" y="419" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#167c78">Faster • still not guaranteed</text><path d="M575 330 h50" stroke="#9eb2bf" stroke-width="4" stroke-linecap="round"/><path d="M612 317 l13 13 -13 13" fill="none" stroke="#9eb2bf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="65" y="526" width="1070" height="80" rx="18" fill="#17374a"/><text x="98" y="558" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#7fe0d2">PRACTICAL PRIORITY</text><text x="98" y="586" font-family="Arial,sans-serif" font-size="20" fill="#fff">Make your pages crawlable, answer real questions and earn credible third-party references.</text><text x="65" y="642" font-family="Arial,sans-serif" font-size="15" fill="#637887">AI products vary. This is a conceptual model, not a guarantee about any one platform's architecture.</text></svg>