<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Google Ads optimization workflow</title>
  <desc id="desc">A clean editorial diagram showing search terms, negatives, ads, bidding and landing pages as connected optimization steps.</desc>
  <rect width="1200" height="675" fill="#f7f7f6"/>
  <text x="80" y="90" fill="#111113" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="3">THE OPTIMIZATION LOOP</text>
  <text x="80" y="145" fill="#111113" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">Look at the data. Find the leak. Reallocate.</text>
  <text x="80" y="185" fill="#66666d" font-family="Arial, Helvetica, sans-serif" font-size="20">The strongest Google Ads accounts are improved through repeated, specific reviews.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="80" y="260" width="190" height="150" rx="20" fill="#fff" stroke="#d8d8dc"/>
    <text x="105" y="305" fill="#77777e" font-size="14" font-weight="700" letter-spacing="1.5">01</text>
    <text x="105" y="345" fill="#111113" font-size="23" font-weight="700">Search terms</text>
    <text x="105" y="375" fill="#66666d" font-size="16">What people</text><text x="105" y="398" fill="#66666d" font-size="16">actually searched</text>

    <rect x="320" y="260" width="190" height="150" rx="20" fill="#fff" stroke="#d8d8dc"/>
    <text x="345" y="305" fill="#77777e" font-size="14" font-weight="700" letter-spacing="1.5">02</text>
    <text x="345" y="345" fill="#111113" font-size="23" font-weight="700">Negatives</text>
    <text x="345" y="375" fill="#66666d" font-size="16">Stop irrelevant</text><text x="345" y="398" fill="#66666d" font-size="16">spend early</text>

    <rect x="560" y="260" width="190" height="150" rx="20" fill="#fff" stroke="#d8d8dc"/>
    <text x="585" y="305" fill="#77777e" font-size="14" font-weight="700" letter-spacing="1.5">03</text>
    <text x="585" y="345" fill="#111113" font-size="23" font-weight="700">Ads &amp; intent</text>
    <text x="585" y="375" fill="#66666d" font-size="16">Test different</text><text x="585" y="398" fill="#66666d" font-size="16">messages</text>

    <rect x="800" y="260" width="190" height="150" rx="20" fill="#fff" stroke="#d8d8dc"/>
    <text x="825" y="305" fill="#77777e" font-size="14" font-weight="700" letter-spacing="1.5">04</text>
    <text x="825" y="345" fill="#111113" font-size="23" font-weight="700">Bidding</text>
    <text x="825" y="375" fill="#66666d" font-size="16">Allocate budget</text><text x="825" y="398" fill="#66666d" font-size="16">where it works</text>

    <path d="M270 335h45M510 335h45M750 335h45" stroke="#99999f" stroke-width="3"/><path d="M305 326l12 9-12 9M545 326l12 9-12 9M785 326l12 9-12 9" fill="none" stroke="#99999f" stroke-width="3"/>

    <rect x="365" y="485" width="470" height="105" rx="22" fill="#111113"/>
    <text x="600" y="528" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">05 · Landing page relevance</text>
    <text x="600" y="558" text-anchor="middle" fill="#b8b8be" font-size="16">Match the page to the search and the promise in the ad.</text>
  </g>
  <path d="M930 410C930 470 835 485 835 485" fill="none" stroke="#99999f" stroke-width="3"/>
  <path d="M365 537C300 537 230 475 230 410" fill="none" stroke="#99999f" stroke-width="3" stroke-dasharray="8 8"/>
</svg>
