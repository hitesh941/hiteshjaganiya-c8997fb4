<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Google Maps visibility troubleshooting workflow</title>
  <desc id="desc">Five-step workflow for checking business verification, profile information, categories, reviews and duplicate or suspended listings.</desc>
  <defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity=".08"/></filter></defs>
  <rect width="1200" height="675" fill="#f7faf8"/>
  <text x="70" y="82" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#1d7b5d">THE LOCAL VISIBILITY CHECK</text>
  <text x="70" y="140" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#173b3b">Troubleshoot before you rebuild.</text>
  <text x="70" y="180" font-family="Arial, sans-serif" font-size="20" fill="#607572">Work from the highest-impact checks down to ongoing visibility signals.</text>
  <g filter="url(#s)">
    <rect x="70" y="240" width="190" height="235" rx="24" fill="#ffffff" stroke="#d9e6e0"/>
    <rect x="285" y="240" width="190" height="235" rx="24" fill="#ffffff" stroke="#d9e6e0"/>
    <rect x="500" y="240" width="190" height="235" rx="24" fill="#ffffff" stroke="#d9e6e0"/>
    <rect x="715" y="240" width="190" height="235" rx="24" fill="#ffffff" stroke="#d9e6e0"/>
    <rect x="930" y="240" width="200" height="235" rx="24" fill="#173b3b"/>
  </g>
  <g font-family="Arial, sans-serif">
    <text x="95" y="280" font-size="15" font-weight="700" fill="#1d7b5d">01</text>
    <text x="95" y="325" font-size="25" font-weight="700" fill="#173b3b">Verify</text>
    <text x="95" y="360" font-size="17" fill="#607572">Is the profile</text><text x="95" y="385" font-size="17" fill="#607572">actually verified?</text>
    <text x="310" y="280" font-size="15" font-weight="700" fill="#1d7b5d">02</text>
    <text x="310" y="325" font-size="25" font-weight="700" fill="#173b3b">Check NAP</text>
    <text x="310" y="360" font-size="17" fill="#607572">Name, address</text><text x="310" y="385" font-size="17" fill="#607572">and phone match.</text>
    <text x="525" y="280" font-size="15" font-weight="700" fill="#1d7b5d">03</text>
    <text x="525" y="325" font-size="25" font-weight="700" fill="#173b3b">Categories</text>
    <text x="525" y="360" font-size="17" fill="#607572">Does the category</text><text x="525" y="385" font-size="17" fill="#607572">match real intent?</text>
    <text x="740" y="280" font-size="15" font-weight="700" fill="#1d7b5d">04</text>
    <text x="740" y="325" font-size="25" font-weight="700" fill="#173b3b">Reviews</text>
    <text x="740" y="360" font-size="17" fill="#607572">Recent, genuine</text><text x="740" y="385" font-size="17" fill="#607572">customer activity.</text>
    <text x="955" y="280" font-size="15" font-weight="700" fill="#b9e5d3">05</text>
    <text x="955" y="325" font-size="25" font-weight="700" fill="#ffffff">Resolve</text>
    <text x="955" y="360" font-size="17" fill="#d7e5e0">Duplicates,</text><text x="955" y="385" font-size="17" fill="#d7e5e0">suspension or</text><text x="955" y="410" font-size="17" fill="#d7e5e0">suppression.</text>
  </g>
  <g stroke="#1d7b5d" stroke-width="3" fill="none" stroke-linecap="round"><path d="M260 355 H280"/><path d="M475 355 H495"/><path d="M690 355 H710"/><path d="M905 355 H925"/></g>
  <text x="70" y="555" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#173b3b">The goal is not to “optimize everything.” It is to find the specific reason visibility is failing.</text>
</svg>