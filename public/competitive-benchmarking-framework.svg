<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Competitive benchmarking framework</title><desc id="desc">A three-step framework showing measure, compare and act.</desc>
<rect width="1200" height="675" rx="32" fill="#f4f8f5"/>
<text x="70" y="82" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" fill="#203d34">The benchmarking loop</text>
<text x="70" y="120" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#657970">Measure a comparable metric, compare it with the right competitors, then act on the gap.</text>
<g transform="translate(70 180)">
<g><rect width="300" height="290" rx="28" fill="#173c32"/><circle cx="60" cy="62" r="30" fill="#55c984"/><text x="50" y="71" font-family="Arial" font-size="24" font-weight="800" fill="#fff">1</text><text x="38" y="125" font-family="Arial" font-size="28" font-weight="800" fill="#fff">Measure</text><text x="38" y="166" font-family="Arial" font-size="18" fill="#d7e8e0">Choose metrics tied</text><text x="38" y="194" font-family="Arial" font-size="18" fill="#d7e8e0">to a decision you may</text><text x="38" y="222" font-family="Arial" font-size="18" fill="#d7e8e0">actually make.</text></g>
<path d="M320 145h70" stroke="#2f9d68" stroke-width="5" stroke-linecap="round"/><path d="M380 132l18 13-18 13" fill="none" stroke="#2f9d68" stroke-width="5"/>
<g transform="translate(410)"><rect width="300" height="290" rx="28" fill="#fff" stroke="#d7e4dd" stroke-width="2"/><circle cx="60" cy="62" r="30" fill="#2f9d68"/><text x="50" y="71" font-family="Arial" font-size="24" font-weight="800" fill="#fff">2</text><text x="38" y="125" font-family="Arial" font-size="28" font-weight="800" fill="#203d34">Compare</text><text x="38" y="166" font-family="Arial" font-size="18" fill="#657970">Use three to five</text><text x="38" y="194" font-family="Arial" font-size="18" fill="#657970">genuine, comparable</text><text x="38" y="222" font-family="Arial" font-size="18" fill="#657970">competitors.</text></g>
<path d="M730 145h70" stroke="#2f9d68" stroke-width="5" stroke-linecap="round"/><path d="M790 132l18 13-18 13" fill="none" stroke="#2f9d68" stroke-width="5"/>
<g transform="translate(820)"><rect width="300" height="290" rx="28" fill="#fff" stroke="#d7e4dd" stroke-width="2"/><circle cx="60" cy="62" r="30" fill="#2f9d68"/><text x="50" y="71" font-family="Arial" font-size="24" font-weight="800" fill="#fff">3</text><text x="38" y="125" font-family="Arial" font-size="28" font-weight="800" fill="#203d34">Act</text><text x="38" y="166" font-family="Arial" font-size="18" fill="#657970">Pick two gaps, make</text><text x="38" y="194" font-family="Arial" font-size="18" fill="#657970">changes, then repeat</text><text x="38" y="222" font-family="Arial" font-size="18" fill="#657970">in six months.</text></g>
</g>
<text x="70" y="560" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#71827b">Competitive benchmarking is useful when the comparison changes what you do next.</text>
</svg>