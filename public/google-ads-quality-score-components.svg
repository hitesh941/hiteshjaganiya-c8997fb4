<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<rect width="1200" height="620" rx="32" fill="#f8fbf9"/>
<text x="70" y="82" font-family="Arial,sans-serif" font-size="30" font-weight="800" fill="#183b2a">The 3 Quality Score Components</text>
<text x="70" y="120" font-family="Arial,sans-serif" font-size="18" fill="#61766b">Each component is rated Below Average, Average, or Above Average.</text>
<g font-family="Arial,sans-serif">
<rect x="70" y="175" width="330" height="300" rx="24" fill="white" stroke="#d9e7de"/><circle cx="235" cy="245" r="45" fill="#e8f4ec"/><text x="235" y="257" text-anchor="middle" font-size="30" font-weight="800" fill="#3f7f58">01</text><text x="105" y="330" font-size="23" font-weight="800" fill="#183b2a">Expected CTR</text><text x="105" y="365" font-size="17" fill="#61766b">Does the ad earn clicks</text><text x="105" y="390" font-size="17" fill="#61766b">for this search?</text>
<rect x="435" y="175" width="330" height="300" rx="24" fill="white" stroke="#d9e7de"/><circle cx="600" cy="245" r="45" fill="#e8f4ec"/><text x="600" y="257" text-anchor="middle" font-size="30" font-weight="800" fill="#3f7f58">02</text><text x="470" y="330" font-size="23" font-weight="800" fill="#183b2a">Ad Relevance</text><text x="470" y="365" font-size="17" fill="#61766b">Does the ad match the</text><text x="470" y="390" font-size="17" fill="#61766b">keyword intent?</text>
<rect x="800" y="175" width="330" height="300" rx="24" fill="white" stroke="#d9e7de"/><circle cx="965" cy="245" r="45" fill="#e8f4ec"/><text x="965" y="257" text-anchor="middle" font-size="30" font-weight="800" fill="#3f7f58">03</text><text x="835" y="330" font-size="23" font-weight="800" fill="#183b2a">Landing Page</text><text x="835" y="365" font-size="17" fill="#61766b">Does the page deliver</text><text x="835" y="390" font-size="17" fill="#61766b">what the ad promised?</text>
</g>
<text x="600" y="545" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#3f7f58">Diagnose the weak component — don't optimise the number in isolation.</text>
</svg>